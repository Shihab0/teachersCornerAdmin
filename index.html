<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher's Corner</title>
    <!-- 🚨 CACHE BUSTING: Prevent browser from caching index.html -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#312e81" />
    <link
      rel="apple-touch-icon"
      href="https://raw.githubusercontent.com/lucide-icons/lucide/main/icons/graduation-cap.svg"
    />
  </head>
  <body class="antialiased">
    <!-- 🚀 PWA সুন্দর লোডিং স্ক্রিন -->
    <div id="pwa-loader">
      <div class="loader-spinner"></div>
      <div class="loader-title">
        Teacher's <span style="color: #facc15; font-weight: 300">CORNER</span>
      </div>
      <div class="loader-subtitle">Management System</div>
      <div style="font-size: 10px; opacity: 0.3; margin-top: 10px;">v1.0.6</div>
      
      <!-- Fallback button if loader stays too long -->
      <button id="force-refresh-btn" style="display: none; margin-top: 30px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px 20px; border-radius: 12px; font-size: 12px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;">
        Force Refresh
      </button>
    </div>
    <div id="root"></div>
    <!-- Version: 1.0.6 -->
    <script type="module" src="/src/main.tsx" onerror="handleScriptError()"></script>
    <script>
      function handleScriptError() {
        console.error('Main script failed to load. This is likely a MIME type or 404 error. Attempting cache clear and reload...');
        
        // Clear all caches
        if ('caches' in window) {
          caches.keys().then((names) => {
            for (let name of names) caches.delete(name);
          });
        }
        
        // Unregister all service workers
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (let registration of registrations) registration.unregister();
          });
        }
        
        // Force reload from server
        setTimeout(() => {
          window.location.reload(true);
        }, 1000);
      }

      // Show force refresh button after 10 seconds
      setTimeout(() => {
        const btn = document.getElementById('force-refresh-btn');
        if (btn) {
          btn.style.display = 'block';
          btn.onclick = () => {
            handleScriptError();
          };
        }
      }, 10000);

      // 🚨 FORCE CLEANUP: Unregister any existing Service Workers to fix the MIME type error
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (let registration of registrations) {
            // If we find a worker that isn't the current one, unregister it
            registration.unregister().then(() => {
              console.log("Service Worker Unregistered Successfully");
            });
          }
        });
      }

      // Clear all caches to be safe on every load to prevent stale index.html
      // This is extreme but necessary if the user is stuck
      if ('caches' in window && !window.location.search.includes('no-clear')) {
        caches.keys().then((names) => {
          for (let name of names) {
            // Only clear if it's an old version or if we're debugging
            if (name.includes('tc-admin')) {
               // caches.delete(name);
            }
          }
        });
      }
    </script>
  </body>
</html>
